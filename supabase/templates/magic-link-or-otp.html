<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Your PAX Tracker sign-in code</title>
  </head>
  <body style="margin:0;background-color:#f5f0e9;color:#241e22;font-family:Arial,sans-serif;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background-color:#f5f0e9;">
      <tr>
        <td align="center" style="padding:24px 12px;">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:520px;background-color:#ffffff;border:1px solid #e3d9ce;border-radius:12px;">
            <tr>
              <td bgcolor="#16151b" style="padding:18px 24px;border-radius:11px 11px 0 0;color:#ffac78;font-size:14px;font-weight:bold;letter-spacing:1px;">
                PAX TRACKER <span style="color:#f7f1df;">| UNPLUGGED EDITION</span>
              </td>
            </tr>
            <tr>
              <td style="padding:24px;">
                <h1 style="margin:0 0 12px;color:#241e22;font-family:Georgia,serif;font-size:28px;line-height:1.2;">Your sign-in code</h1>
                <p style="margin:0 0 20px;font-size:16px;line-height:1.5;">Enter this one-time code on the PAX Tracker sign-in screen to open your booth checklist.</p>
                <p style="margin:0 0 20px;padding:14px 12px;background-color:#fff1e6;border:1px solid #ebc8af;border-radius:8px;color:#241e22;text-align:center;">
                  <strong style="font-family:Courier New,monospace;font-size:28px;line-height:1.2;">{{ .Token }}</strong>
                </p>
                <p style="margin:0;color:#514750;font-size:14px;line-height:1.5;">If you didn't request this code, you can ignore this email. Don't share the code with anyone.</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
